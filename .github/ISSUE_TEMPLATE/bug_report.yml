name: Сообщение об ошибке
description: Сообщить о сбое или неверной работе ГСО-Ассистента
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! После открытия репозитория Issues будут публичными. Не публикуйте паспорта, рабочие базы, ФИО сотрудников, пароли или конфиденциальные документы.
  - type: input
    id: version
    attributes:
      label: Версия ГСО-Ассистента
      placeholder: "0.3.0-beta1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 64-bit"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести проблему
      description: Перечислите действия без конфиденциальных сведений.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Какой результат ожидался
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло на самом деле
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенный журнал или скриншот (необязательно)
      description: Удалите персональные данные, пути и имена сотрудников.
    validations:
      required: false
